name: Continuous Integration

on:
  push:
    branches: [ main, develop, epic/** ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  ci:
    name: Test, Lint, Format, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard frontend
        run: |
          cd dashboard
          npm ci
          npm run build
          mkdir -p ../internal/dashboard/dist
          cp -r dist/* ../internal/dashboard/dist/

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not properly formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build -v ./cmd/portfolio

      - name: Build verification
        run: |
          if [ ! -f ./portfolio ]; then
            echo "Build failed: portfolio binary not found"
            exit 1
          fi
          echo "Build successful: portfolio binary created"