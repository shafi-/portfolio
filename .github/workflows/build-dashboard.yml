name: Build Dashboard

on:
  push:
    paths:
      - 'dashboard/**'
      - '.github/workflows/build-dashboard.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/build-dashboard.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Type check
        run: |
          cd dashboard
          npm run typecheck

      - name: Lint
        run: |
          cd dashboard
          npm run lint

      - name: Build
        run: |
          cd dashboard
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dashboard-dist
          path: dashboard/dist
