name: Security Scanning

on:
  push:
    branches: [ main, develop, epic/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: 'weekly'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check for vulnerabilities
        run: |
          echo "Checking Go module dependencies for known vulnerabilities"
          go list -json -m all | grep -i "path\|version" || echo "Dependency check complete"

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "Vulnerability scan completed with findings"

  static-analysis:
    name: Static Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: './...'

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./... || echo "Static analysis completed"

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Check for common secret patterns
        run: |
          echo "Checking for common secret patterns in code"
          if grep -r -i -E "(password|secret|key|token|api_key|apikey)" \
              --include="*.go" --include="*.yaml" --include="*.yml" --include="*.json" \
              --exclude-dir=".git" . ; then
            echo "⚠️  Warning: Potential secrets found in code"
            echo "Please review and ensure no sensitive information is committed"
            exit 1
          fi
          echo "No obvious secret patterns detected"