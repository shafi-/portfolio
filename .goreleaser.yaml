# Goreleaser configuration for Portfolio
# Builds single binary releases for multiple platforms
# Uses modernc.org/sqlite (pure Go) — no CGO required

project_name: portfolio
before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
    ldflags:
      - -s -w
      - -X project-dash/internal/version.version={{.Version}}
      - -X project-dash/internal/version.commit={{.Commit}}
      - -X project-dash/internal/version.date={{.Date}}
    main: ./cmd/portfolio

archives:
  - format: binary
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

release:
  draft: false
  prerelease: false

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'

universal_binaries:
  - replace: false
    name_template: 'portfolio-darwin-universal'
